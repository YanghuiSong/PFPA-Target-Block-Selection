[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pfpa-target-block-selection"
version = "0.1.0"
description = "PFPA target-gradient encoder-block selection and adaptation experiment code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "Pillow>=9.5,<13",
  "PyYAML>=6,<7",
  "tqdm>=4.64,<5",
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "transformers>=4.40,<5",
]

[project.scripts]
pfpa-scan-b0 = "probe_transformer_block_plasticity:main"
pfpa-update-b0 = "probe_function_preserving_update:main"
pfpa-confirm-b0 = "pfpa_confirmatory_runner_v2:main"
pfpa-scan-swin = "run_swin_interventions:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = [
  "probe_transformer_block_plasticity",
  "probe_function_preserving_update",
  "pfpa_confirmatory_runner_v2",
  "run_swin_interventions",
  "swin_t_model",
]
